name: Local quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint workspace
        run: pnpm lint

      - name: Unit and component tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      # Deliberately excluded: remote Supabase integration, migrations,
      # browser journeys, deployments, and all secrets/production access.

  database-pgtap:
    name: Local Supabase pgTAP contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start disposable local Supabase
        run: npx supabase start

      - name: Rebuild local database from migrations
        run: npx supabase db reset

      - name: Run pgTAP database contracts
        run: npx supabase test db

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
