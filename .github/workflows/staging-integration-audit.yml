name: Disposable staging integration audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/critical-platform-contracts
    paths:
      - ".github/workflows/staging-integration-audit.yml"
      - "packages/database/**"
      - "supabase/**"

permissions:
  contents: read

concurrency:
  group: staging-integration-audit
  cancel-in-progress: false

jobs:
  integration:
    name: Run isolated Supabase audit
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run disposable staging audit
        run: pnpm test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_AUDIT_ALLOW_REMOTE: "true"
