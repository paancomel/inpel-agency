name: Assemble INPOLOR master directive

on:
  push:
    branches:
      - agent/inpolor-master-directive
    paths:
      - .directive-chunks/READY

permissions:
  contents: write

concurrency:
  group: assemble-inpolor-master-directive
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out directive branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify canonical directive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/inpolor-relaunch
          cat .directive-chunks/part-* | base64 --decode > docs/inpolor-relaunch/MASTER_DIRECTIVE.md

          expected_sha="c9e097715be20a5a7db6eda7e6649423f5f9853f55fbc68278b8f89064b7c35f"
          actual_sha="$(sha256sum docs/inpolor-relaunch/MASTER_DIRECTIVE.md | awk '{print $1}')"
          expected_bytes="54245"
          actual_bytes="$(wc -c < docs/inpolor-relaunch/MASTER_DIRECTIVE.md | tr -d ' ')"

          test "$actual_sha" = "$expected_sha"
          test "$actual_bytes" = "$expected_bytes"

      - name: Create relaunch governance files
        shell: bash
        run: |
          set -euo pipefail

          cat > docs/inpolor-relaunch/README.md <<'EOF'
          # INPOLOR Relaunch Governance

          **Status:** Active and approved  
          **Adopted:** 2026-08-19  
          **Scope:** INPOLOR relaunch and product rebuild

          ## Authority order

          1. [`MASTER_DIRECTIVE.md`](./MASTER_DIRECTIVE.md) is the authoritative source for relaunch objectives, product principles, execution phases, required deliverables, agent responsibilities, guardrails, and acceptance criteria.
          2. Current-state facts must be verified against the repository, Supabase migrations and live schema, configured environments, and deployed applications. The directive defines the intended direction; it does not replace evidence about what currently exists.
          3. [`04_DECISION_LOG.md`](./04_DECISION_LOG.md) records approved interpretations, deviations, and decisions that refine or supersede part of the directive.
          4. [`TASK_BOARD.md`](./TASK_BOARD.md) records execution status, dependencies, ownership, testing, and deployment requirements.

          ## Conflict handling

          Existing INPOLOR plans and specifications remain useful historical or supporting references. Where an older document conflicts with the target direction in the master directive, the master directive and any later approved decision-log entry take precedence.

          No material deviation may be introduced silently. It must be documented in the decision log with evidence, trade-offs, reversibility, owner, and follow-up date.

          ## Execution posture

          - Complete Phase 0 audit and dependency mapping before large relaunch implementation.
          - Keep product, trust, data, frontend, analytics, growth, and QA workstreams coordinated through explicit handoffs.
          - Do not publish fabricated reviews, misleading aggregates, or demo data as real evidence.
          - Do not expose reviewer identity or verification evidence to institution roles.
          - Prefer reversible, feature-flagged, tested changes.
          - Keep the existing critical-platform hardening PR separate; adoption of this directive does not automatically broaden that PR's scope.

          ## Required progress report

          After every major phase, report in Bahasa Melayu using the structure required by the master directive: completed phase, concrete output, decisions, changed files, tests, risks, outstanding work, and next phase.
          EOF

          cat > docs/inpolor-relaunch/04_DECISION_LOG.md <<'EOF'
          # INPOLOR Relaunch Decision Log

          This log is append-only in intent. New decisions may supersede older decisions, but prior records should remain available for auditability.

          ## ADR-INPOLOR-0001 — Adopt the relaunch master directive

          - **Status:** Accepted
          - **Date:** 2026-08-19
          - **Decision:** Adopt `MASTER_DIRECTIVE.md` as the official master directive for the INPOLOR relaunch and product rebuild.
          - **Reason:** The relaunch needs one authoritative framework spanning product strategy, UX, trust and safety, privacy, backend architecture, frontend implementation, analytics, growth, QA, staged deployment, and final acceptance.
          - **Evidence:** Explicit product-owner approval on 2026-08-19 and the supplied Master Orchestration Prompt.
          - **Alternatives considered:**
            - Keep the prompt only in conversation history.
            - Append selected sections to the existing public-launch specification.
            - Add the relaunch scope to the existing critical-contract hardening PR.
          - **Trade-offs:**
            - Creates a substantially larger, multi-phase programme of work.
            - Requires audit and dependency mapping before visible redesign work.
            - Improves traceability and prevents disconnected feature development.
          - **Reversibility:** Reversible only through a later approved ADR that explicitly supersedes this decision.
          - **Owner:** Product Owner and Lead Orchestrator
          - **Follow-up date:** At completion of Phase 0 audit
          - **Consequences:**
            - Target positioning is a verified student decision and reality-check platform, not a gossip platform.
            - Private verification and public anonymity must remain technically separated.
            - Programme-campus density takes priority over catalogue breadth and nationwide ranking.
            - No large relaunch implementation begins before the current-state audit and dependency map are complete.
            - Major work is coordinated through the required sub-agent roles and handoff format.
            - Fake reviews, misleading small-sample ratings, paid review control, and silent deviations are prohibited.
          EOF

          cat > docs/inpolor-relaunch/TASK_BOARD.md <<'EOF'
          # INPOLOR Relaunch Task Board

          **Last updated:** 2026-08-19  
          **Authoritative scope:** [`MASTER_DIRECTIVE.md`](./MASTER_DIRECTIVE.md)

          Status values: `backlog`, `ready`, `in_progress`, `blocked`, `in_review`, `testing`, `done`, `deferred`.

          | Task ID | Title | Owner sub-agent | Status | Priority | Dependencies | Files affected | Database impact | Security impact | Analytics impact | Definition of done | Tests required | Deployment requirement |
          |---|---|---|---|---|---|---|---|---|---|---|---|---|
          | REL-000 | Adopt official master directive and governance | Orchestrator | done | P0 | None | `docs/inpolor-relaunch/*`, root `README.md` | None | Establishes mandatory security guardrails | Establishes analytics requirements | Canonical directive, authority order, initial ADR, and task board are versioned and linked | Integrity checksum and repository CI | Documentation merge only |
          | REL-001 | Produce current-state audit | Orchestrator, A, D | ready | P0 | REL-000 | `00_CURRENT_STATE_AUDIT.md` | Inventory live and migrated schema without destructive changes | Identify privacy, RLS, auth, evidence, and role risks | Inventory current events and blind spots | All 20 audit areas in the directive are evidence-backed and gaps are explicit | Source traceability review | None |
          | REL-002 | Produce system architecture and dependency map | Orchestrator, D | ready | P0 | REL-000 | Phase 0 architecture documents | Map canonical IDs, portal boundaries, migrations, and external services | Mark trust boundaries and privileged operations | Map event-producing boundaries | Current and intended dependencies are explicit, including blockers | Architecture consistency review | None |
          | REL-003 | Produce product gap and review-funnel analysis | A, B, F | ready | P0 | REL-001 | Phase 0 analysis documents | None initially | Identify unsafe conversion shortcuts | Define measurable discovery, contribution, verification, approval, unlock, and referral gaps | Gaps are prioritised by evidence and user impact | Analytical peer review | None |
          | REL-004 | Produce trust, privacy, and moderation risk analysis | C, D, H | ready | P0 | REL-001, REL-002 | Phase 0 risk register | Inspect verification and moderation data flows | Rank re-identification, evidence access, RLS, retention, abuse, and legal-review risks | Verify prohibited data is excluded from event design | Risks include likelihood, impact, owner, mitigation, and dependency | RLS and data-flow test plan review | None |
          | REL-005 | Define proposed target architecture | Orchestrator, C, D | blocked | P0 | REL-001, REL-002, REL-003, REL-004 | Target architecture and schema-map documents | Potential future migrations; no production mutation yet | Must preserve verification separation and explicit authorization | Defines analytics-event boundary | Architecture resolves discovered gaps and documents reversible migration steps | Design review, migration-test plan | None until approved |
          | REL-006 | Define first foundation implementation milestone | Orchestrator | blocked | P0 | REL-005 | Decision log and implementation plan | Determined by approved architecture | Includes explicit security acceptance criteria | Includes measurable funnel impact | Smallest high-leverage foundation slice has owner, files, tests, rollback, and deployment gate | Milestone-specific | Feature-flagged staging only |
          EOF

      - name: Link directive from repository README
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          marker = "INPOLOR relaunch work is governed by the approved"
          block = """
          > [!IMPORTANT]
          > INPOLOR relaunch work is governed by the approved [INPOLOR Relaunch Master Directive](docs/inpolor-relaunch/MASTER_DIRECTIVE.md). Current-state facts must still be verified against code, migrations, and deployed environments. Approved interpretations or deviations must be recorded in the [decision log](docs/inpolor-relaunch/04_DECISION_LOG.md), and execution status is maintained in the [task board](docs/inpolor-relaunch/TASK_BOARD.md).
          """.strip()

          if marker not in text:
              lines = text.splitlines()
              insert_at = 1 if lines and lines[0].startswith("# ") else 0
              lines[insert_at:insert_at] = ["", block, ""]
              path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")

      - name: Remove assembly material and commit official directive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .directive-chunks
          rm -f .github/workflows/assemble-inpolor-master-directive.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: adopt INPOLOR relaunch master directive"
          git push origin HEAD:agent/inpolor-master-directive
